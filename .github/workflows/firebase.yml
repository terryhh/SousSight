name: Validate and deploy SousSight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soussight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.9'
  FIREBASE_CLI_VERSION: '15.35.0'
  FIREBASE_PROJECT: devfest-flutter-a59e8
  CI: 'true'
  # Judged-build configuration (DESIGN.md §6-§7). Checked by
  # tool/check_build_config.sh before every non-rehearsal compile.
  # CLOUD_ROUTES stays empty (no cloud routes) until gate G1 approves some.
  DINNER_MODE: ${{ vars.DINNER_MODE || 'simulated' }}
  LIVE_BACKEND: ${{ vars.LIVE_BACKEND || 'none' }}
  CLOUD_ROUTES: ${{ vars.CLOUD_ROUTES || '' }}

jobs:
  validate:
    name: Tests and rehearsal build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            test/rules/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          npm --prefix functions ci
          npm --prefix test/rules ci
          npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"
      - name: Validate Flutter and browser media
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --coverage
          node --test test/live/browser_media_test.cjs
      - name: Validate hybrid bridge JavaScript
        shell: bash
        run: |
          shopt -s nullglob
          bridge_tests=(test/hybrid/*.cjs)
          if ((${#bridge_tests[@]} == 0)); then
            echo 'No test/hybrid/*.cjs files yet; skipping.'
            exit 0
          fi
          node --test "${bridge_tests[@]}"
      - name: Validate ai_logic_hybrid plugin
        working-directory: packages/ai_logic_hybrid
        # The plugin is a library and keeps no pubspec.lock.
        run: |
          flutter pub get
          flutter test --no-pub --coverage
      # Same gate as tool/verify_all.sh (SS-088): line coverage of lib/ and the
      # plugin's lib/ must not fall below tool/coverage/baseline.json.
      - name: Coverage gate
        shell: bash
        run: |
          status=0
          python3 -I tool/coverage/coverage_gate.py || status=$?
          if [[ -f build/verify/coverage.txt ]]; then
            { echo '### Line coverage'; echo '```'; cat build/verify/coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Validate backend and project publisher
        run: |
          npm --prefix functions run check
          npm --prefix functions test
          python3 -m unittest discover -s test/tool -p 'test_*.py'
          node --test test/tool/*.cjs
      - name: Verify private Firestore rules in emulator
        run: npm --prefix test/rules test
      - name: Build visibly simulated rehearsal
        run: ./tool/build_web.sh --no-pub --dart-define=FAKE_BACKEND=true
      # Compile what the deploy job compiles, minus secrets: none are needed
      # to compile (RECAPTCHA_SITE_KEY and RESEARCH_MODEL have code defaults).
      - name: Check judged build configuration
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'judged_defines.json').write_text(json.dumps({
              'FAKE_BACKEND': 'false',
              'DINNER_MODE': os.environ['DINNER_MODE'],
              'LIVE_BACKEND': os.environ['LIVE_BACKEND'],
              'CLOUD_ROUTES': os.environ['CLOUD_ROUTES'],
          }))
          PY
          ./tool/check_build_config.sh --judged "$RUNNER_TEMP/judged_defines.json"
      - name: Compile judged (non-rehearsal) build
        run: ./tool/build_web.sh --no-pub "--dart-define-from-file=$RUNNER_TEMP/judged_defines.json"
      # Ephemeral Live markers only warn here until SS-074 compiles the
      # transport out; the deploy job enforces them.
      - name: Check judged bundle
        run: >-
          ./tool/check_web_bundle.sh --warn-live-marker
          --commit "$GITHUB_SHA" --config "$RUNNER_TEMP/judged_defines.json" build/web

  deploy:
    name: Deploy production
    needs: validate
    if: >-
      github.repository == 'terryhh/SousSight' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.FIREBASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://devfest-flutter-a59e8.web.app
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: soussight-production
      cancel-in-progress: false
    env:
      RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # One Live model for the server and the AI Logic client (DESIGN.md §7);
      # it is also compiled in as GEMINI_LIVE_MODEL below.
      LIVE_MODEL: ${{ vars.LIVE_MODEL || 'gemini-3.1-flash-live-preview' }}
      LIVE_API_VERSION: ${{ vars.LIVE_API_VERSION || 'v1beta' }}
      RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'gemini-3.8-flash' }}
      DINNER_SERVICE_READY: ${{ vars.DINNER_SERVICE_READY || 'false' }}
      DINNER_CHANNEL: ${{ vars.DINNER_CHANNEL || 'whatsapp' }}
      ENABLE_DINNER_MESSAGES: ${{ vars.ENABLE_DINNER_MESSAGES || 'false' }}
      # true only after VONAGE_SIGNATURE_SECRET exists in Secret Manager.
      DINNER_STATUS_READY: ${{ vars.DINNER_STATUS_READY || 'false' }}
      ALLOW_DELIVERY_SIMULATION: ${{ vars.ALLOW_DELIVERY_SIMULATION || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require production configuration
        shell: bash
        run: |
          for setting in RECAPTCHA_SITE_KEY WORKLOAD_IDENTITY_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing production variable $setting"
              exit 1
            fi
          done
          if [[ "$ENABLE_DINNER_MESSAGES" != false && "$ENABLE_DINNER_MESSAGES" != true ]]; then
            echo '::error::ENABLE_DINNER_MESSAGES must be false or true'
            exit 1
          fi
          if [[ "$DINNER_SERVICE_READY" != false && "$DINNER_SERVICE_READY" != true ]]; then
            echo '::error::DINNER_SERVICE_READY must be false or true'
            exit 1
          fi
          if [[ "$ENABLE_DINNER_MESSAGES" == true && "$DINNER_SERVICE_READY" != true ]]; then
            echo '::error::Dinner sending requires a configured dinner service'
            exit 1
          fi
          for flag in DINNER_STATUS_READY ALLOW_DELIVERY_SIMULATION; do
            if [[ "${!flag}" != false && "${!flag}" != true ]]; then
              echo "::error::$flag must be false or true"
              exit 1
            fi
          done
          if [[ "$DINNER_STATUS_READY" == true && "$DINNER_SERVICE_READY" != true ]]; then
            echo '::error::The Vonage status webhook requires a configured dinner service'
            exit 1
          fi
          if [[ "$DINNER_CHANNEL" != whatsapp && "$DINNER_CHANNEL" != sms ]]; then
            echo '::error::DINNER_CHANNEL must be whatsapp or sms'
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install deployment dependencies
        run: |
          flutter pub get --enforce-lockfile
          npm --prefix functions ci
          npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"
      - name: Write public build configuration and non-secret function parameters
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          build = {
              'FAKE_BACKEND': 'false',
              'RECAPTCHA_SITE_KEY': os.environ['RECAPTCHA_SITE_KEY'],
              'RESEARCH_MODEL': os.environ['RESEARCH_MODEL'],
              'DINNER_MODE': os.environ['DINNER_MODE'],
              'LIVE_BACKEND': os.environ['LIVE_BACKEND'],
              'CLOUD_ROUTES': os.environ['CLOUD_ROUTES'],
              'GEMINI_LIVE_MODEL': os.environ['LIVE_MODEL'],
          }
          Path('dart_defines.local.json').write_text(json.dumps(build))
          # Package main is used by Firebase discovery AND the uploaded runtime.
          # --only functions:liveToken alone still discovers dinner secret params.
          # vonageStatus binds VONAGE_SIGNATURE_SECRET, so it is only packaged
          # when DINNER_STATUS_READY=true; otherwise discovery would fail.
          dinner_ready = os.environ['DINNER_SERVICE_READY'] == 'true'
          status_ready = dinner_ready and os.environ['DINNER_STATUS_READY'] == 'true'
          package_path = Path('functions/package.json')
          package = json.loads(package_path.read_text())
          package['main'] = ('src/index.js' if status_ready
                             else 'src/live-dinner-index.js' if dinner_ready
                             else 'src/live-index.js')
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          # The judged build never uses the ephemeral transport (SS-074), so
          # /api/live-token is never served; /api/live-session only with aiLogic.
          removed = {'/api/live-token'}
          if os.environ['LIVE_BACKEND'] != 'aiLogic':
              removed.add('/api/live-session')
          if not dinner_ready:
              removed.add('/api/dinner-ready')
          if not status_ready:
              removed.add('/api/vonage-status')
          if removed:
              config_path = Path('firebase.json')
              config = json.loads(config_path.read_text())
              config['hosting']['rewrites'] = [
                  rule for rule in config['hosting']['rewrites']
                  if rule.get('source') not in removed]
              config_path.write_text(json.dumps(config))
          params = {key: os.environ[key] for key in (
              'LIVE_MODEL', 'LIVE_API_VERSION', 'DINNER_CHANNEL', 'ENABLE_DINNER_MESSAGES',
              'ALLOW_DELIVERY_SIMULATION')}
          for key, value in params.items():
              if not re.fullmatch(r'[A-Za-z0-9._/-]+', value):
                  raise SystemExit(f'Invalid non-secret deployment parameter: {key}')
          params['LIVE_ALLOWED_ORIGINS'] = (
              'https://devfest-flutter-a59e8.web.app,'
              'https://devfest-flutter-a59e8.firebaseapp.com')
          # Always provide a value: an empty param default blocks
          # non-interactive deploys. 'disabled' is ignored by the runtime.
          params['DINNER_STATUS_WEBHOOK_URL'] = (
              'https://devfest-flutter-a59e8.web.app/api/vonage-status'
              if status_ready else 'disabled')
          Path('functions/.env.devfest-flutter-a59e8').write_text(
              ''.join(f'{key}={value}\n' for key, value in params.items()))
          PY
      - name: Check judged build configuration
        run: ./tool/check_build_config.sh --judged dart_defines.local.json
      - name: Build real-service web app
        run: ./tool/build_web.sh --no-pub --dart-define-from-file=dart_defines.local.json
      - name: Check bundle and stamp version.json
        run: >-
          ./tool/check_web_bundle.sh
          --commit "$GITHUB_SHA" --ref "$GITHUB_REF_NAME"
          --config dart_defines.local.json build/web
      # Authenticate only after package installation/build; never run this on a PR.
      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: devfest-flutter-a59e8
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy reviewed production resources
        run: |
          # Auth provider provisioning is a one-time setup prerequisite.
          # The judged build never deploys liveToken (ephemeral Live, SS-074);
          # liveSession is the AI Logic Live reservation and ships with aiLogic.
          targets=firestore
          if [[ "$LIVE_BACKEND" == aiLogic ]]; then
            targets+=,functions:liveSession
          fi
          if [[ "$DINNER_SERVICE_READY" == true ]]; then
            targets+=,functions:dinnerReady
            if [[ "$DINNER_STATUS_READY" == true ]]; then
              targets+=,functions:vonageStatus
            fi
          fi
          targets+=,hosting
          echo "Deploy targets: $targets"
          firebase deploy --project "$FIREBASE_PROJECT" --only "$targets" --non-interactive
      - name: Check Hosting response
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://devfest-flutter-a59e8.web.app/ --output /dev/null
      - name: Check hosted version.json matches this commit
        shell: bash
        run: |
          # Allow a short CDN propagation window after the release.
          for attempt in 1 2 3 4 5 6; do
            served="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              "https://devfest-flutter-a59e8.web.app/version.json?ci=$GITHUB_RUN_ID-$attempt" |
              python3 -c 'import json, sys; print(json.load(sys.stdin).get("commit", ""))' || true)"
            if [[ "$served" == "$GITHUB_SHA" ]]; then
              echo "Hosted build is $served"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Hosted version.json commit '$served' is not $GITHUB_SHA"
          exit 1
